<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Aplicações PRO | HAlexandre</title>
    <meta name="description" content="Dashboard pessoal para gerenciar links e ferramentas favoritas.">
    <meta name="author" content="HAlexandre">
    <meta name="theme-color" content="#0ea5e9">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd',
                            300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9',
                            600: '#0284c7', 700: '#0369a1', 800: '#075985',
                            900: '#0c4a6e',
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        html.dark body { background-color: #0f172a; }
        
        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        html.dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .app-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        html.dark .app-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            border-color: #0ea5e9;
        }
        
        .floating-action {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            box-shadow: 0 4px 14px 0 rgba(14, 165, 233, 0.39);
            transition: transform 0.2s;
        }
        .floating-action:hover { transform: scale(1.05) rotate(90deg); }
        .floating-action:active { transform: scale(0.95); }

        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        /* Notificação Toast */
        .notification {
            transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .notification.show { transform: translateX(0); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        html.dark ::-webkit-scrollbar-thumb { background: #334155; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200">

    <!-- Navbar -->
    <nav class="glass sticky top-0 z-40 w-full transition-colors duration-300">
        <div class="container mx-auto px-4 md:px-6 py-3">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start">
                    <div class="flex items-center gap-3">
                        <div class="relative group cursor-pointer">
                            <img src="LOGO_HERBERT_LEMOS.png" alt="Logo" class="w-10 h-10 rounded-full border-2 border-white dark:border-slate-700 shadow-sm group-hover:scale-105 transition-transform" onerror="this.src='https://ui-avatars.com/api/?name=HA&background=0ea5e9&color=fff'">
                            <div class="absolute inset-0 rounded-full ring-1 ring-black/5 dark:ring-white/10"></div>
                        </div>
                        <div>
                            <h1 class="text-lg font-bold text-slate-800 dark:text-white leading-tight">Painel PRO</h1>
                            <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Hub de Ferramentas</p>
                        </div>
                    </div>
                    
                    <!-- Mobile Toggle -->
                    <div class="flex md:hidden gap-2">
                        <button id="mobileThemeToggle" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center">
                            <i class="fas fa-moon"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div class="relative w-full md:w-64 group">
                        <div class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-brand-500 transition-colors">
                            <i class="fas fa-search"></i>
                        </div>
                        <input type="text" id="searchInput" placeholder="Pesquisar..." class="w-full pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white dark:focus:bg-slate-800 transition-all shadow-sm">
                    </div>
                    
                    <div class="hidden md:flex gap-2">
                        <button id="themeToggle" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-amber-400 hover:text-white dark:hover:bg-slate-700 transition-all flex items-center justify-center">
                            <i class="fas fa-moon"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 md:px-6 py-8 min-h-[calc(100vh-140px)]">
        
        <!-- Grid de Apps -->
        <div id="dashboardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards serão injetados aqui -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center animate-fade-in-up">
            <div class="w-20 h-20 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mb-6 shadow-inner">
                <i class="fas fa-cubes text-3xl text-slate-300 dark:text-slate-600"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-700 dark:text-slate-200 mb-2">Painel vazio</h3>
            <p class="text-slate-500 dark:text-slate-400 mb-6 max-w-sm mx-auto">Adicione suas ferramentas favoritas para acesso rápido.</p>
            <button onclick="document.getElementById('addAppBtn').click()" class="bg-brand-600 hover:bg-brand-700 text-white px-6 py-2.5 rounded-xl font-medium transition-colors shadow-lg shadow-brand-500/20">
                <i class="fas fa-plus mr-2"></i> Adicionar Primeiro App
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 mt-auto">
        <div class="container mx-auto px-6 py-6 text-center">
            <div id="signature" class="text-sm text-slate-500 dark:text-slate-400 font-medium"></div>
        </div>
    </footer>

    <!-- FAB (Floating Action Button) -->
    <button id="addAppBtn" class="floating-action fixed bottom-6 right-6 w-14 h-14 rounded-full text-white flex items-center justify-center shadow-xl z-40 group" title="Adicionar Aplicação">
        <i class="fas fa-plus text-xl transition-transform group-hover:rotate-90"></i>
    </button>

    <!-- Modal de Edição/Criação -->
    <div id="modal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 hidden z-50 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-lg transform scale-95 transition-transform duration-300 border border-slate-100 dark:border-slate-700 overflow-hidden flex flex-col max-h-[90vh]">
            
            <div class="p-6 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <h2 id="modalTitle" class="text-xl font-bold text-slate-800 dark:text-white">Nova Aplicação</h2>
                <button id="closeModalBtn" class="text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto custom-scrollbar">
                <form id="appForm" class="space-y-5">
                    <input type="hidden" id="appId">
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-2">URL do Link</label>
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><i class="fas fa-link"></i></span>
                            <input type="url" id="appLink" class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all dark:text-white" placeholder="ex: https://chatgpt.com" required>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-1 ml-1">O ícone será buscado automaticamente.</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-2">Nome</label>
                            <input type="text" id="appTitle" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none transition-all dark:text-white" placeholder="Nome da ferramenta" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-2">Categoria</label>
                            <select id="appCategory" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none transition-all dark:text-white appearance-none">
                                <option value="Produtividade">⚡ Produtividade</option>
                                <option value="Contabilidade">📈 Contabilidade</option>
                                <option value="Utilitários">🛠️ Utilitários</option>
                                <option value="Finanças">💰 Finanças</option>
                                <option value="Social">💬 Social</option>
                                <option value="Outros">🧩 Outros</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-2">Descrição (Opcional)</label>
                        <textarea id="appDescription" rows="2" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none transition-all dark:text-white resize-none" placeholder="Breve descrição..."></textarea>
                    </div>
                </form>
            </div>

            <div class="p-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 flex justify-end gap-3">
                <button type="button" id="cancelBtn" class="px-5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors">Cancelar</button>
                <button type="button" onclick="document.getElementById('appForm').requestSubmit()" class="px-6 py-2.5 text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-lg shadow-brand-500/30 transition-all transform active:scale-95">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        // ============================================
        // CONFIGURAÇÃO - SEUS LINKS FIXOS AQUI
        // ============================================
        const APPS_FIXOS = [
            {
                id: '1',
                title: 'PDF PRO',
                link: 'https://halexandre1.github.io/PDF_PRO/',
                category: 'Produtividade',
                description: 'Simplifique a edição e o gerenciamento de seus PDFs.'
            },
            {
                id: '2',
                title: 'Calculadora de Impostos',
                link: 'https://halexandre1.github.io/CalculadoraImpostos/',
                category: 'Contabilidade',
                description: 'Calculadora profissional para análise e detalhamento de retenções em notas fiscais.'
            },
            {
                id: '3',
                title: 'Consulta CNPJ',
                link: 'https://halexandre1.github.io/ConsultaCNPJ/',
                category: 'Utilitários',
                description: 'Ferramenta ágil para consulta e verificação rápida de dados cadastrais de empresas através do CNPJ.'
            },
            {
                id: '4',
                title: 'Extrator de Números',
                link: 'https://halexandre1.github.io/Extrair_Numeros/',
                category: 'Utilitários',
                description: 'Ferramenta prática para limpar textos e extrair apenas os dígitos numéricos, ideal para formatação rápida de dados.'
            },
            {
                id: '5',
                title: 'Calendario Financeiro',
                link: 'https://halexandre1.github.io/Calendario_2026/',
                category: 'Utilitários',
                description: 'Ferramenta com o intuito de melhorar a vizualização do Calendario Financeiro do ano de 2026.'
            }
        ];
        // ============================================

        // --- UI Module ---
        const UI = {
            dom: {
                grid: document.getElementById('dashboardGrid'),
                empty: document.getElementById('emptyState'),
                modal: document.getElementById('modal'),
                form: document.getElementById('appForm'),
                inputs: {
                    id: document.getElementById('appId'),
                    title: document.getElementById('appTitle'),
                    desc: document.getElementById('appDescription'),
                    link: document.getElementById('appLink'),
                    cat: document.getElementById('appCategory')
                },
                search: document.getElementById('searchInput'),
                signature: document.getElementById('signature')
            },

            categoryIcons: {
                'Utilitários': { icon: 'fa-tools', color: 'text-blue-500', bg: 'bg-blue-100 dark:bg-blue-900/30' },
                'Contabilidade': { icon: 'fa-chart-line', color: 'text-emerald-500', bg: 'bg-emerald-100 dark:bg-emerald-900/30' },
                'Finanças': { icon: 'fa-coins', color: 'text-green-500', bg: 'bg-green-100 dark:bg-green-900/30' },
                'Produtividade': { icon: 'fa-rocket', color: 'text-purple-500', bg: 'bg-purple-100 dark:bg-purple-900/30' },
                'Social': { icon: 'fa-comments', color: 'text-pink-500', bg: 'bg-pink-100 dark:bg-pink-900/30' },
                'Outros': { icon: 'fa-shapes', color: 'text-slate-500', bg: 'bg-slate-100 dark:bg-slate-700/50' }
            },

            init() {
                this.loadTheme();
                this.renderSignature();
                this.setupModals();
            },

            loadTheme() {
                const saved = localStorage.getItem('theme');
                const isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', isDark);
                this.updateThemeIcons(isDark);
            },

            toggleTheme() {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                this.updateThemeIcons(isDark);
            },

            updateThemeIcons(isDark) {
                const icons = document.querySelectorAll('#themeToggle i, #mobileThemeToggle i');
                icons.forEach(i => i.className = isDark ? 'fas fa-sun text-yellow-400' : 'fas fa-moon text-brand-600');
            },

            renderSignature() {
                const year = new Date().getFullYear();
                this.dom.signature.innerHTML = `Feito com <i class="fas fa-heart text-red-500 mx-1"></i> por HAlexandre © ${year}`;
            },

            showToast(msg, type = 'success') {
                const toast = document.createElement('div');
                const colors = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
                toast.className = `notification fixed top-5 right-5 z-[60] ${colors} text-white px-6 py-3 rounded-xl shadow-xl font-medium flex items-center gap-3`;
                toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;
                document.body.appendChild(toast);
                
                requestAnimationFrame(() => toast.classList.add('show'));
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            },

            renderApps(apps) {
                this.dom.grid.innerHTML = '';
                
                if (apps.length === 0) {
                    this.dom.empty.classList.remove('hidden');
                    this.dom.empty.classList.add('flex');
                    return;
                }

                this.dom.empty.classList.add('hidden');
                this.dom.empty.classList.remove('flex');

                apps.forEach((app, index) => {
                    // Match category case-insensitively or default to 'Outros'
                    const catKey = Object.keys(this.categoryIcons).find(k => k.toLowerCase() === app.category.toLowerCase());
                    const catStyle = catKey ? this.categoryIcons[catKey] : this.categoryIcons['Outros'];
                    const displayCategory = catKey || app.category; // Ensure correct casing

                    const domain = new URL(app.link).hostname;
                    const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

                    const card = document.createElement('div');
                    card.className = 'app-card bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm flex flex-col h-full opacity-0 animate-fade-in-up';
                    card.style.animationDelay = `${index * 50}ms`;
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3 overflow-hidden">
                                <img src="${faviconUrl}" alt="icon" class="w-10 h-10 rounded-lg bg-slate-50 dark:bg-slate-700 p-1 object-contain shadow-sm border border-slate-100 dark:border-slate-600" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(app.title)}&background=random'">
                                <div class="min-w-0">
                                    <h3 class="font-bold text-slate-800 dark:text-white text-lg leading-tight mb-1" style="word-break: break-word;">${app.title}</h3>
                                    <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full ${catStyle.bg} ${catStyle.color} inline-block">
                                        ${displayCategory}
                                    </span>
                                </div>
                            </div>
                            
                            <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-200 ml-2 flex-shrink-0">
                                <button onclick="window.editApp('${app.id}')" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-400 hover:text-brand-500 transition-colors">
                                    <i class="fas fa-pen text-xs"></i>
                                </button>
                                <button onclick="window.deleteApp('${app.id}')" class="w-8 h-8 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/30 text-slate-400 hover:text-red-500 transition-colors">
                                    <i class="fas fa-trash text-xs"></i>
                                </button>
                            </div>
                        </div>
                        
                        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6 flex-grow line-clamp-2">${app.description || 'Sem descrição.'}</p>
                        
                        <div class="flex gap-3 mt-auto">
                            <a href="${app.link}" target="_blank" class="flex-1 bg-slate-50 dark:bg-slate-700/50 hover:bg-brand-50 dark:hover:bg-brand-900/30 border border-slate-200 dark:border-slate-600 hover:border-brand-200 dark:hover:border-brand-700 text-slate-700 dark:text-slate-200 font-semibold py-2.5 px-4 rounded-xl transition-all text-center flex items-center justify-center gap-2 group/btn">
                                <span>Abrir</span> <i class="fas fa-external-link-alt text-xs text-slate-400 group-hover/btn:text-brand-500 transition-colors"></i>
                            </a>
                            <button onclick="window.copyLink('${app.link}')" class="w-11 h-11 flex items-center justify-center rounded-xl border border-slate-200 dark:border-slate-600 text-slate-400 hover:text-brand-500 hover:border-brand-200 dark:hover:border-brand-700 hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-all" title="Copiar Link">
                                <i class="far fa-copy"></i>
                            </button>
                        </div>
                    `;
                    
                    // Adicionar classe 'group' para hover effects funcionarem
                    card.classList.add('group');
                    this.dom.grid.appendChild(card);
                });
            },

            toggleModal(show, modalId = 'modal') {
                const modal = document.getElementById(modalId);
                const content = modal.querySelector('div');
                
                if (show) {
                    modal.classList.remove('hidden');
                    // Pequeno delay para permitir display block antes da opacidade
                    requestAnimationFrame(() => {
                        modal.classList.remove('opacity-0');
                        content.classList.remove('scale-95');
                        content.classList.add('scale-100');
                    });
                } else {
                    modal.classList.add('opacity-0');
                    content.classList.remove('scale-100');
                    content.classList.add('scale-95');
                    setTimeout(() => modal.classList.add('hidden'), 300);
                }
            },

            setupModals() {
                // Main Modal
                const openMain = () => { this.dom.form.reset(); this.dom.inputs.id.value = ''; this.toggleModal(true); };
                const closeMain = () => this.toggleModal(false);
                
                document.getElementById('addAppBtn').onclick = openMain;
                document.getElementById('closeModalBtn').onclick = closeMain;
                document.getElementById('cancelBtn').onclick = closeMain;
                
                // Close on backdrop click
                window.onclick = (e) => {
                    if (e.target.classList.contains('modal-backdrop')) {
                        this.toggleModal(false);
                    }
                };
            }
        };

        // --- Storage Module (Simplificado - apenas dados fixos) ---
        const Storage = {
            data: [],

            init() {
                // Carrega dados fixos do array APPS_FIXOS
                this.data = [...APPS_FIXOS];
                App.refresh();
            },

            add(app) {
                app.id = Date.now().toString();
                app.createdAt = new Date().toISOString();
                this.data.unshift(app);
                App.refresh();
            },

            update(id, updates) {
                const idx = this.data.findIndex(a => a.id === id);
                if (idx !== -1) {
                    this.data[idx] = { ...this.data[idx], ...updates };
                    App.refresh();
                }
            },

            remove(id) {
                this.data = this.data.filter(a => a.id !== id);
                App.refresh();
            }
        };

        // --- App Controller ---
        const App = {
            filter: '',

            init() {
                UI.init();
                Storage.init();
                
                // Event Listeners
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.filter = e.target.value.toLowerCase();
                    this.refresh();
                });

                document.getElementById('themeToggle').onclick = () => UI.toggleTheme();
                document.getElementById('mobileThemeToggle').onclick = () => UI.toggleTheme();

                UI.dom.form.onsubmit = async (e) => {
                    e.preventDefault();
                    const inputs = UI.dom.inputs;
                    
                    let link = inputs.link.value.trim();
                    if (!/^https?:\/\//i.test(link)) link = 'https://' + link;

                    const appData = {
                        title: inputs.title.value.trim(),
                        category: inputs.cat.value,
                        description: inputs.desc.value.trim(),
                        link: link
                    };

                    const id = inputs.id.value;
                    if (id) {
                        await Storage.update(id, appData);
                        UI.showToast('Aplicação atualizada!');
                    } else {
                        await Storage.add(appData);
                        UI.showToast('Aplicação criada!');
                    }
                    UI.toggleModal(false);
                };
            },

            refresh() {
                const filtered = Storage.data.filter(app => 
                    app.title.toLowerCase().includes(this.filter) || 
                    (app.description && app.description.toLowerCase().includes(this.filter))
                );
                UI.renderApps(filtered);
            }
        };

        // --- Global Helpers (for inline onclicks) ---
        window.editApp = (id) => {
            const app = Storage.data.find(a => a.id === id);
            if (app) {
                UI.dom.inputs.id.value = app.id;
                UI.dom.inputs.title.value = app.title;
                UI.dom.inputs.link.value = app.link;
                
                // Attempt to match category ignoring case, default to existing logic if it fails
                const catOptions = Array.from(UI.dom.inputs.cat.options);
                const matchingOption = catOptions.find(opt => opt.value.toLowerCase() === app.category.toLowerCase());
                if(matchingOption) {
                     UI.dom.inputs.cat.value = matchingOption.value;
                } else {
                     UI.dom.inputs.cat.value = app.category;
                }

                UI.dom.inputs.desc.value = app.description || '';
                UI.dom.modal.querySelector('h2').textContent = 'Editar Aplicação';
                UI.toggleModal(true);
            }
        };

        window.deleteApp = async (id) => {
            if (confirm('Tem certeza que deseja excluir esta ferramenta?')) {
                await Storage.remove(id);
                UI.showToast('Aplicação removida.', 'error');
            }
        };

        window.copyLink = (url) => {
            // Updated clipboard method to handle iframe restrictions gracefully
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(url).then(() => {
                    UI.showToast('Link copiado!');
                }).catch(err => {
                    console.error('Failed to copy via Clipboard API', err);
                    fallbackCopyTextToClipboard(url);
                });
            } else {
                fallbackCopyTextToClipboard(url);
            }
        };

        function fallbackCopyTextToClipboard(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; // Avoid scrolling to bottom
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                var successful = document.execCommand('copy');
                if (successful) {
                    UI.showToast('Link copiado!');
                } else {
                    UI.showToast('Erro ao copiar', 'error');
                }
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                UI.showToast('Erro ao copiar', 'error');
            }
            document.body.removeChild(textArea);
        }

        // Start
        App.init();
    </script>
</body>
</html>
